<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | The Everything</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            padding: 30px 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: white;

            background:

                radial-gradient(
                    circle at 15% 20%,
                    rgba(124,58,237,0.18),
                    transparent 35%
                ),

                radial-gradient(
                    circle at 85% 75%,
                    rgba(32,201,187,0.15),
                    transparent 35%
                ),

                #05070d;

        }


        .reset-box {

            width:
                min(
                    470px,
                    100%
                );

            padding:
                38px;

            border-radius:
                24px;

            background:
                rgba(13,17,25,0.95);

            border:
                1px solid
                rgba(255,255,255,0.08);

            box-shadow:
                0 30px 90px
                rgba(0,0,0,0.45);

        }


        .small-title {

            margin:
                0 0
                10px;

            text-align: center;

            color:
                #55eec7;

            font-size:
                10px;

            font-weight:
                900;

            letter-spacing:
                3px;

            text-transform:
                uppercase;

        }


        h1 {

            margin:
                0 0
                10px;

            text-align: center;

            font-size:
                32px;

        }


        .description {

            margin:
                0 0
                30px;

            text-align: center;

            color:
                #798493;

            font-size:
                13px;

            line-height:
                1.6;

        }


        .form-group {

            margin-bottom:
                18px;

        }


        label {

            display: block;

            margin-bottom:
                8px;

            color:
                #aeb7c3;

            font-size:
                12px;

            font-weight:
                800;

        }


        input {

            width: 100%;

            height: 49px;

            padding:
                0 14px;

            outline: none;

            border-radius:
                11px;

            color:
                white;

            font-family:
                inherit;

            font-size:
                13px;

            background:
                rgba(255,255,255,0.04);

            border:
                1px solid
                rgba(255,255,255,0.10);

            transition:
                0.2s ease;

        }


        input:focus {

            border-color:
                rgba(69,241,189,0.60);

            background:
                rgba(255,255,255,0.06);

        }


        input:disabled {

            opacity:
                0.5;

            cursor:
                not-allowed;

        }


        #resetPasswordButton {

            width: 100%;

            min-height:
                49px;

            margin-top:
                4px;

            border:
                none;

            border-radius:
                11px;

            cursor:
                pointer;

            color:
                #03110d;

            font-family:
                inherit;

            font-size:
                12px;

            font-weight:
                900;

            background:
                linear-gradient(
                    135deg,
                    #45f1bd,
                    #66ebdb
                );

            transition:
                0.2s ease;

        }


        #resetPasswordButton:hover {

            transform:
                translateY(-2px);

        }


        #resetPasswordButton:disabled {

            cursor:
                not-allowed;

            opacity:
                0.50;

            transform:
                none;

        }


        #message {

            min-height:
                22px;

            margin:
                18px 0
                0;

            text-align:
                center;

            color:
                #929daa;

            font-size:
                12px;

            line-height:
                1.6;

        }


        .back-login {

            display: block;

            margin-top:
                22px;

            text-align: center;

            color:
                #68e9d6;

            text-decoration:
                none;

            font-size:
                11px;

            font-weight:
                800;

        }


        .back-login:hover {

            text-decoration:
                underline;

        }


        @media (max-width: 520px) {

            .reset-box {

                padding:
                    30px 22px;

            }

        }

    </style>

</head>


<body>


    <main class="reset-box">

        <p class="small-title">
            Security
        </p>


        <h1>
            Reset Password
        </h1>


        <p class="description">
            Enter a new password for your account.
        </p>



        <!-- NEW PASSWORD -->

        <div class="form-group">

            <label for="newPassword">
                New Password
            </label>


            <input
                type="password"
                id="newPassword"
                placeholder="Enter new password"
                autocomplete="new-password"
                disabled
            >

        </div>



        <!-- CONFIRM PASSWORD -->

        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>


            <input
                type="password"
                id="confirmPassword"
                placeholder="Enter password again"
                autocomplete="new-password"
                disabled
            >

        </div>



        <button
            type="button"
            id="resetPasswordButton"
            disabled
        >
            Set New Password
        </button>


        <p id="message">
            Checking recovery link...
        </p>


        <a
            href="login.html"
            class="back-login"
        >
            ← Back to Login
        </a>

    </main>



    <!-- SUPABASE -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>



    <script>

        /* =================================
           SUPABASE
        ================================= */

        const SUPABASE_URL =
            "https://tnavsfbolastevebukxl.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_3FX_mPM-A6dIY-nQTtFZQg_5HPoWO9B";


        const supabaseClient =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        /* =================================
           ELEMENTS
        ================================= */

        const newPasswordInput =
            document.getElementById(
                "newPassword"
            );


        const confirmPasswordInput =
            document.getElementById(
                "confirmPassword"
            );


        const resetPasswordButton =
            document.getElementById(
                "resetPasswordButton"
            );


        const message =
            document.getElementById(
                "message"
            );



        let recoveryReady =
            false;



        /* =================================
           ENABLE RESET FORM
        ================================= */

        function enableResetForm() {

            recoveryReady =
                true;


            newPasswordInput.disabled =
                false;


            confirmPasswordInput.disabled =
                false;


            resetPasswordButton.disabled =
                false;


            message.textContent =
                "Recovery link verified. Enter your new password.";


            setTimeout(

                function() {

                    newPasswordInput.focus();

                },

                100

            );

        }



        /* =================================
           WATCH AUTH
        ================================= */

        supabaseClient
            .auth
            .onAuthStateChange(

                function(
                    event,
                    session
                ) {

                    console.log(
                        "Auth event:",
                        event
                    );


                    if (
                        event ===
                        "PASSWORD_RECOVERY"
                    ) {

                        enableResetForm();

                    }

                }

            );



        /* =================================
           RESET PASSWORD
        ================================= */

        resetPasswordButton
            .addEventListener(

                "click",

                async function() {

                    const newPassword =
                        newPasswordInput
                            .value;


                    const confirmPassword =
                        confirmPasswordInput
                            .value;



                    /* =========================
                       RECOVERY CHECK
                    ========================= */

                    if (
                        !recoveryReady
                    ) {

                        message.textContent =
                            "Please open this page using the password reset link from your email.";


                        return;

                    }



                    /* =========================
                       EMPTY
                    ========================= */

                    if (
                        !newPassword
                        ||
                        !confirmPassword
                    ) {

                        message.textContent =
                            "Enter and confirm your new password.";


                        return;

                    }



                    /* =========================
                       LENGTH
                    ========================= */

                    if (
                        newPassword.length <
                        6
                    ) {

                        message.textContent =
                            "Password must be at least 6 characters.";


                        return;

                    }



                    /* =========================
                       CONFIRM
                    ========================= */

                    if (
                        newPassword !==
                        confirmPassword
                    ) {

                        message.textContent =
                            "Passwords do not match.";


                        return;

                    }



                    /* =========================
                       SAVING
                    ========================= */

                    resetPasswordButton.disabled =
                        true;


                    resetPasswordButton.textContent =
                        "Saving...";


                    message.textContent =
                        "Updating your password...";



                    /* =========================
                       UPDATE PASSWORD
                    ========================= */

                    const {
                        error
                    } =
                        await supabaseClient

                            .auth

                            .updateUser({

                                password:
                                    newPassword

                            });



                    /* =========================
                       ERROR
                    ========================= */

                    if (
                        error
                    ) {

                        console.error(
                            "Password reset error:",
                            error
                        );


                        message.textContent =
                            error.message;


                        resetPasswordButton.disabled =
                            false;


                        resetPasswordButton.textContent =
                            "Set New Password";


                        return;

                    }



                    /* =========================
                       SUCCESS
                    ========================= */

                    newPasswordInput.value =
                        "";


                    confirmPasswordInput.value =
                        "";


                    newPasswordInput.disabled =
                        true;


                    confirmPasswordInput.disabled =
                        true;


                    resetPasswordButton.textContent =
                        "Password Updated ✓";


                    message.textContent =
                        "Password changed successfully. Redirecting to login...";



                    /*
                        Log out recovery session,
                        then make the user sign in
                        with the new password.
                    */

                    await supabaseClient

                        .auth

                        .signOut({

                            scope:
                                "local"

                        });



                    setTimeout(

                        function() {

                            window.location.href =
                                "login.html";

                        },

                        1800

                    );

                }

            );



        /* =================================
           ENTER KEY
        ================================= */

        confirmPasswordInput
            .addEventListener(

                "keydown",

                function(event) {

                    if (
                        event.key ===
                        "Enter"
                    ) {

                        resetPasswordButton.click();

                    }

                }

            );



        /* =================================
           INVALID / EXPIRED LINK MESSAGE
        ================================= */

        setTimeout(

            function() {

                if (
                    !recoveryReady
                ) {

                    message.textContent =
                        "Waiting for a valid password recovery link. If this link expired, request a new one from Settings.";

                }

            },

            3000

        );

    </script>


</body>

</html>
