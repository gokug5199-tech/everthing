    <!-- Page-specific visual upgrades: search, background, side characters -->
    <style>
        /* Keep decorative layers behind the page content. */
        body {
            isolation: isolate;
        }

        /* Updated anime-page background palette. */
        .anime-background {
            z-index: -3 !important;
            background:
                radial-gradient(circle at 86% 45%, rgba(255, 48, 112, 0.22) 0%, rgba(255, 48, 112, 0.08) 24%, transparent 47%),
                radial-gradient(circle at 15% 18%, rgba(111, 72, 255, 0.25) 0%, rgba(111, 72, 255, 0.08) 24%, transparent 46%),
                radial-gradient(circle at 70% 4%, rgba(34, 122, 255, 0.18) 0%, transparent 38%),
                linear-gradient(135deg, #0b1028 0%, #171430 38%, #0f1d3b 70%, #17122f 100%) !important;
        }

        .glow-1 {
            background: rgba(107, 71, 255, 0.55) !important;
        }

        .glow-2 {
            background: rgba(255, 47, 111, 0.50) !important;
        }

        .glow-3 {
            background: rgba(30, 132, 255, 0.42) !important;
        }

        /* Decorative transparent anime characters on both sides. */
        .side-character {
            position: fixed;
            bottom: -4vh;
            width: clamp(420px, 34vw, 650px);
            height: min(94vh, 1050px);
            object-fit: contain;
            object-position: bottom center;
            opacity: 0.17;
            pointer-events: none;
            user-select: none;
            z-index: -2;
            filter: saturate(0.82) contrast(1.05);
        }

        /* Ayanokoji - left side: enlarged to fill the marked side area. */
        .side-character-left {
            width: clamp(390px, 30vw, 560px);
            left: clamp(-125px, -6vw, -55px);
            opacity: 0.16;
        }

        /* Goku - right side: enlarged to fill the marked side area. */
        .side-character-right {
            width: clamp(430px, 33vw, 610px);
            right: clamp(-145px, -7vw, -65px);
            opacity: 0.15;
        }

        /* Search stays outside the normal layout, so it cannot push Trending Anime down. */
        .anime-search {
            position: fixed;
            top: 82px;
            right: clamp(28px, 6vw, 110px);
            width: min(310px, calc(100vw - 56px));
            height: 48px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            gap: 11px;
            padding: 0 16px;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid rgba(255, 255, 255, 0.17);
            border-radius: 15px;
            -webkit-backdrop-filter: blur(14px);
            backdrop-filter: blur(14px);
            box-shadow: 0 10px 34px rgba(0, 0, 0, 0.14);
            transition: background 180ms ease, border-color 180ms ease, box-shadow 180ms ease, transform 180ms ease;
            z-index: 10000;
        }

        .anime-search:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.42);
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.18), 0 0 24px rgba(255, 255, 255, 0.055);
        }

        .anime-search:focus-within {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.68);
            box-shadow: 0 12px 38px rgba(0, 0, 0, 0.20), 0 0 0 3px rgba(255, 255, 255, 0.04);
        }

        /* CSS-only magnifying glass avoids any global SVG styles changing its size. */
        .anime-search-icon {
            position: relative;
            width: 18px;
            height: 18px;
            flex: 0 0 18px;
            opacity: 0.62;
            transition: opacity 180ms ease;
        }

        .anime-search-icon::before {
            content: "";
            position: absolute;
            width: 10px;
            height: 10px;
            left: 1px;
            top: 1px;
            border: 2px solid #fff;
            border-radius: 50%;
            box-sizing: border-box;
        }

        .anime-search-icon::after {
            content: "";
            position: absolute;
            width: 7px;
            height: 2px;
            left: 10px;
            top: 12px;
            border-radius: 2px;
            background: #fff;
            transform: rotate(45deg);
            transform-origin: left center;
        }

        .anime-search:hover .anime-search-icon,
        .anime-search:focus-within .anime-search-icon {
            opacity: 0.95;
        }

        .anime-search input {
            width: 100%;
            min-width: 0;
            border: 0;
            outline: 0;
            background: transparent;
            color: #fff;
            font: inherit;
            font-size: 14px;
        }

        .anime-search input::placeholder {
            color: rgba(255, 255, 255, 0.43);
            transition: color 180ms ease;
        }

        .anime-search:hover input::placeholder,
        .anime-search:focus-within input::placeholder {
            color: rgba(255, 255, 255, 0.76);
        }

        .anime-card.search-hidden,
        .anime-card-link.search-hidden {
            display: none !important;
        }

        @media (max-width: 1050px) {
            .side-character {
                width: 360px;
                height: 88vh;
                opacity: 0.11;
            }

            .side-character-left {
                left: -95px;
            }

            .side-character-right {
                right: -115px;
            }

            .anime-search {
                top: 74px;
                right: 28px;
                width: 260px;
            }
        }

        @media (max-width: 760px) {
            .side-character {
                display: none;
            }

            .anime-search {
                position: relative;
                top: auto;
                right: auto;
                width: calc(100% - 36px);
                margin: 18px auto 8px;
            }
        }
    </style>
