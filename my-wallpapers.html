        .info-bar {

        .add-button {

            padding:

            background:

        /* =================================
           STATUS
        ================================= */

        .status-message {

            width:

                    90%

            padding:
                60px 20px;

            text-align:
                center;

        /* =================================
           GRID
        ================================= */

        .wallpaper-grid {

            width:
                min(
                    1400px,
                    90%
                );

            margin:
                0 auto
                100px;

            display:
                grid;

            grid-template-columns:
                repeat(
                    3,
                    minmax(0, 1fr)
                );

            gap:
                22px;

        }



        /* =================================
           CARD
        ================================= */

        .wallpaper-card {

            position:
                relative;

            height:
                290px;

            overflow:
                hidden;

            border-radius:
                18px;

            background:
                #080d13;

            border:
                1px solid
                rgba(255,255,255,0.07);

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.25);

            transition:
                0.22s ease;

        }


        .wallpaper-card:hover {

            transform:
                translateY(-4px);

            border-color:
                rgba(83,245,205,0.35);

            box-shadow:
                0 15px 35px
                rgba(0,0,0,0.35);

        }


        .wallpaper-image {

            position:
                absolute;

            inset:
                0;

            width:
                100%;

            height:
                100%;

            object-fit:
                cover;

            transition:
                transform 0.3s ease;

        }


        .wallpaper-card:hover
        .wallpaper-image {

            transform:
                scale(1.035);

        }


        .wallpaper-card::after {

            content: "";

            position:
                absolute;

            inset:
                0;

            z-index:
                1;

            pointer-events:
                none;

            background:
                linear-gradient(
                    to top,
                    rgba(2,5,8,0.96) 0%,
                    rgba(2,5,8,0.50) 42%,
                    transparent 78%
                );

        }



        /* =================================
           CATEGORY
        ================================= */

        .wallpaper-category {

            position:
                absolute;

            top:
                14px;

            left:
                14px;

            z-index:
                5;

            padding:
                7px 11px;

            border-radius:
                50px;

            color:
                #6affd8;

            background:
                rgba(4,11,12,0.90);

            border:
                1px solid

            font-size:
                10px;

            font-weight:
                800;

            text-transform:
                uppercase;

            letter-spacing:
                1px;

        }



        /* =================================
           CARD CONTENT
        ================================= */

        .wallpaper-content {

            position:
                absolute;

            inset:
                0;

            z-index:
                4;

            display:
                flex;

            flex-direction:
                column;

            justify-content:
                flex-end;

            padding:

        .wallpaper-title {

            margin:

            font-size:
                20px;

            font-weight:

            white-space:
                nowrap;

            overflow:
                hidden;

        .wallpaper-date {

            margin:

                10px;

        /* =================================
           BUTTONS
        ================================= */

        .wallpaper-actions {

                flex;

            gap:

        .action-button {

            flex:
                1;

            min-height:
                39px;

                flex;

                9px;

                pointer;

            font-family:

                12px;

            font-weight:
                800;

            transition:
                0.2s ease;

        }


        .preview-button {

            color:

            border:
                1px solid
                rgba(255,255,255,0.14);

        }


        .preview-button:hover {

        .delete-button {

        .delete-button:hover {

            border-color:
                rgba(255,90,104,0.45);

        .delete-button:disabled {

            cursor:
                not-allowed;

            opacity:

        /* =================================
           PREVIEW

            z-index:

            display:
                none;

        .close-preview {

    <script

    <script>

        /* =================================
           SUPABASE SETTINGS
        ================================= */

        const SUPABASE_URL =
            "https://tnavsfbolastevebukxl.supabase.co";


        const SUPABASE_KEY =
            "sb_publishable_3FX_mPM-A6dIY-nQTtFZQg_5HPoWO9B";


        const myWallpapersSupabase =
            supabase.createClient(
                SUPABASE_URL,
                SUPABASE_KEY
            );



        /* =================================
           ELEMENTS
        ================================= */

        const wallpaperGrid =
            document.getElementById(
                "wallpaperGrid"
            );


        const wallpaperCount =
            document.getElementById(
                "wallpaperCount"
            );


        const statusMessage =
            document.getElementById(
                "statusMessage"
            );


        const preview =
            document.getElementById(
                "preview"
            );


        const previewImage =
            document.getElementById(
                "previewImage"
            );


        const closePreview =
            document.getElementById(
                "closePreview"
            );


        const deleteModal =
            document.getElementById(
                "deleteModal"
            );


        const deleteWallpaperName =
            document.getElementById(
                "deleteWallpaperName"
            );


        const cancelDelete =
            document.getElementById(
                "cancelDelete"
            );


        const confirmDelete =
            document.getElementById(
                "confirmDelete"
            );



        /* =================================
           CURRENT DELETE ITEM
        ================================= */

        let wallpaperToDelete =
            null;



        /* =================================
           FORMAT CATEGORY
        ================================= */

        function formatCategory(
            category
        ) {

            if (!category) {
                return "Other";
            }


            return category

                .replace(
                    /[-_]+/g,
                    " "
                )

                .split(" ")

                .map(

                    word =>

                        word
                            .charAt(0)
                            .toUpperCase()

                        +

                        word.slice(1)

                )

                .join(" ");

        }



        /* =================================
           FORMAT DATE
        ================================= */

        function formatDate(
            date
        ) {

            if (!date) {
                return "";
            }


            const value =
                new Date(
                    date
                );


            return value
                .toLocaleDateString(

                    undefined,

                    {

                        year:
                            "numeric",

                        month:
                            "short",

                        day:
                            "numeric"

                    }

                );

        }



        /* =================================
           LOAD MY WALLPAPERS
        ================================= */

        async function loadMyWallpapers() {

            statusMessage.style.display =
                "block";


            statusMessage.textContent =
                "Loading your wallpapers...";


            wallpaperGrid.innerHTML =
                "";



            /* =============================
               GET CURRENT USER
            ============================= */

            const {
                data: {
                    user
                },
                error:
                    userError
            } =
                await myWallpapersSupabase

                    .auth

                    .getUser();



            if (
                userError
                ||
                !user
            ) {

                window.location.href =
                    "login.html";


                return;

            }



            /* =============================
               LOAD ONLY THIS USER
            ============================= */

            const {
                data:
                    wallpapers,
                error
            } =
                await myWallpapersSupabase

                    .from(
                        "wallpapers"
                    )

                    .select(
                        "id, user_id, title, category, file_path, created_at"
                    )

                    .eq(
                        "user_id",
                        user.id
                    )

                    .order(
                        "created_at",
                        {
                            ascending:
                                false
                        }
                    );



            if (
                error
            ) {

                console.error(
                    "Load wallpapers error:",
                    error
                );


                statusMessage.textContent =
                    "Could not load your wallpapers.";


                return;

            }



            wallpaperCount.textContent =
                wallpapers.length;



            /* =============================
               EMPTY
            ============================= */

            if (
                wallpapers.length === 0
            ) {

                statusMessage.innerHTML =

                    `
                        You haven't uploaded any wallpapers yet.
                        <br><br>
                        Go to Wallpapers and press the + button.
                    `;


                return;

            }



            statusMessage.style.display =
                "none";



            /* =============================
               CREATE CARDS
            ============================= */

            wallpapers.forEach(

                wallpaper => {

                    createWallpaperCard(
                        wallpaper
                    );

                }

            );

        }



        /* =================================
           CREATE WALLPAPER CARD
        ================================= */

        function createWallpaperCard(
            wallpaper
        ) {

            const {
                data:
                    publicUrlData
            } =
                myWallpapersSupabase

                    .storage

                    .from(
                        "wallpapers"
                    )

                    .getPublicUrl(
                        wallpaper.file_path
                    );


            const imageUrl =
                publicUrlData.publicUrl;



            /* CARD */

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "wallpaper-card";



            /* IMAGE */

            const image =
                document.createElement(
                    "img"
                );


            image.className =
                "wallpaper-image";


            image.src =
                imageUrl;


            image.alt =
                wallpaper.title;


            image.loading =
                "lazy";



            /* CATEGORY */

            const category =
                document.createElement(
                    "span"
                );


            category.className =
                "wallpaper-category";


            category.textContent =
                formatCategory(
                    wallpaper.category
                );



            /* CONTENT */

            const content =
                document.createElement(
                    "div"
                );


            content.className =
                "wallpaper-content";



            /* TITLE */

            const title =
                document.createElement(
                    "h3"
                );


            title.className =
                "wallpaper-title";


            title.textContent =
                wallpaper.title;



            /* DATE */

            const date =
                document.createElement(
                    "p"
                );


            date.className =
                "wallpaper-date";


            date.textContent =

                "Uploaded "

                +

                formatDate(
                    wallpaper.created_at
                );



            /* ACTIONS */

            const actions =
                document.createElement(
                    "div"
                );


            actions.className =
                "wallpaper-actions";



            /* PREVIEW */

            const previewButton =
                document.createElement(
                    "button"
                );


            previewButton.type =
                "button";


            previewButton.className =
                "action-button preview-button";


            previewButton.textContent =
                "Preview";


            previewButton.addEventListener(

                "click",

                function() {

                    openPreview(
                        imageUrl
                    );

                }

            );



            /* DELETE */

            const deleteButton =
                document.createElement(
                    "button"
                );


            deleteButton.type =
                "button";


            deleteButton.className =
                "action-button delete-button";


            deleteButton.textContent =
                "Delete";


            deleteButton.addEventListener(

                "click",

                function() {

                    openDeleteModal(
                        wallpaper
                    );

                }

            );



            actions.append(
                previewButton,
                deleteButton
            );


            content.append(
                title,
                date,
                actions
            );


            card.append(
                image,
                category,
                content
            );


            wallpaperGrid.appendChild(
                card
            );

        }



        /* =================================
           PREVIEW
        ================================= */

        function openPreview(
            imageUrl
        ) {

            previewImage.src =
                imageUrl;


            preview.classList.add(
                "show"
            );


            document.body.style.overflow =
                "hidden";

        }


        function hidePreview() {

            preview.classList.remove(
                "show"
            );


            previewImage.src =
                "";


            document.body.style.overflow =
                "";

        }


        closePreview.addEventListener(

            "click",

            hidePreview

        );


        preview.addEventListener(

            "click",

            function(event) {

                if (
                    event.target ===
                    preview
                ) {

                    hidePreview();

                }

            }

        );



        /* =================================
           OPEN DELETE MODAL
        ================================= */

        function openDeleteModal(
            wallpaper
        ) {

            wallpaperToDelete =
                wallpaper;


            deleteWallpaperName.textContent =
                wallpaper.title;


            deleteModal.classList.add(
                "show"
            );


            document.body.style.overflow =
                "hidden";

        }



        /* =================================
           CLOSE DELETE MODAL
        ================================= */

        function closeDeleteModal() {

            deleteModal.classList.remove(
                "show"
            );


            wallpaperToDelete =
                null;


            confirmDelete.disabled =
                false;


            confirmDelete.textContent =
                "Delete";


            document.body.style.overflow =
                "";

        }


        cancelDelete.addEventListener(

            "click",

            closeDeleteModal

        );


        deleteModal.addEventListener(

            "click",

            function(event) {

                if (
                    event.target ===
                    deleteModal
                ) {

                    closeDeleteModal();

                }

            }

        );



        /* =================================
           DELETE WALLPAPER
        ================================= */

        confirmDelete.addEventListener(

            "click",

            async function() {

                if (
                    !wallpaperToDelete
                ) {

                    return;

                }


                confirmDelete.disabled =
                    true;


                confirmDelete.textContent =
                    "Deleting...";



                /* =========================
                   VERIFY USER
                ========================= */

                const {
                    data: {
                        user
                    },
                    error:
                        userError
                } =
                    await myWallpapersSupabase

                        .auth

                        .getUser();



                if (
                    userError
                    ||
                    !user
                ) {

                    window.location.href =
                        "login.html";


                    return;

                }



                /*
                    Extra frontend check.

                    RLS is still the real
                    security protection.
                */

                if (
                    wallpaperToDelete.user_id
                    !==
                    user.id
                ) {

                    alert(
                        "You cannot delete this wallpaper."
                    );


                    closeDeleteModal();


                    return;

                }



                const wallpaperId =
                    wallpaperToDelete.id;


                const filePath =
                    wallpaperToDelete.file_path;



                /* =========================
                   DELETE DATABASE RECORD
                ========================= */

                const {
                    error:
                        databaseError
                } =
                    await myWallpapersSupabase

                        .from(
                            "wallpapers"
                        )

                        .delete()

                        .eq(
                            "id",
                            wallpaperId
                        )

                        .eq(
                            "user_id",
                            user.id
                        );



                if (
                    databaseError
                ) {

                    console.error(
                        "Database delete error:",
                        databaseError
                    );


                    alert(
                        "Could not delete wallpaper."
                    );


                    confirmDelete.disabled =
                        false;


                    confirmDelete.textContent =
                        "Delete";


                    return;

                }



                /* =========================
                   DELETE STORAGE FILE
                ========================= */

                const {
                    error:
                        storageError
                } =
                    await myWallpapersSupabase

                        .storage

                        .from(
                            "wallpapers"
                        )

                        .remove(
                            [
                                filePath
                            ]
                        );



                if (
                    storageError
                ) {

                    console.error(
                        "Storage delete error:",
                        storageError
                    );

                }



                /* =========================
                   SUCCESS
                ========================= */

                closeDeleteModal();


                await loadMyWallpapers();

            }

        );



        /* =================================
           ESCAPE
        ================================= */

        document.addEventListener(

            "keydown",

            function(event) {

                if (
                    event.key !==
                    "Escape"
                ) {

                    return;

                }


                if (
                    deleteModal
                        .classList
                        .contains(
                            "show"
                        )
                ) {

                    closeDeleteModal();

                    return;

                }


                if (
                    preview
                        .classList
                        .contains(
                            "show"
                        )
                ) {

                    hidePreview();

                }

            }

        );



        /* =================================
           START
        ================================= */

        loadMyWallpapers();

    </script>

    <script src="account-menu.js"></script>
